name: Bypass corpus

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Every known bypass must still be caught
        run: ./bypasses/run.sh macos

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every known bypass must still be caught
        run: ./bypasses/run.sh android

  registry-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The table used to be hand-written, so what a reader saw and what the
      # check accepted could drift apart with nobody noticing.
      - name: The README's registry table must match the registry
        run: python3 tools/render-registry.py --check

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A verifier that only ever fails things is not a verifier. This is the
      # other direction: an app with no networking must come out PASS.
      - name: A clean app must pass
        run: |
          cp verifiers/android/fixture/stays-local.json ./stays-local.json
          ./verify.sh .
