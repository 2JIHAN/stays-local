name: Certify

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/repo to certify"
        required: true
      ref:
        description: "git ref (blank = default branch)"
        required: false
        default: ""
      slug:
        description: "registry filename, e.g. steam-shelf"
        required: true
      platform:
        description: "macos or android"
        required: true
        default: "macos"
        type: choice
        options: [macos, android]

concurrency:
  group: registry-writes
  cancel-in-progress: false

jobs:
  # Three jobs, and the split matters more than it looks.
  #
  # This one runs the applicant's build command, which is arbitrary code. It
  # therefore holds no token that can write this repository AND none of the
  # verifier's own code is present in its workspace — because a build that can
  # overwrite the program which writes the verdict can simply write "verified"
  # over its own failure. Containing the token was necessary and not
  # sufficient; the applicant must also not be able to author the answer.
  build:
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-15' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Build the artifact
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          export STAYS_LOCAL_OUT="$RUNNER_TEMP/out"
          eval "$(python3 -c "import json;print(json.load(open('stays-local.json'))['build'])")"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ inputs.slug }}
          path: ${{ runner.temp }}/out
          include-hidden-files: true

  # Inspects what the build produced. Nothing the applicant controls runs here
  # except the app itself, during the runtime layer — and the verifier
  # fingerprints its own code before and after, so tampering during that window
  # aborts instead of producing a verdict.
  verify:
    needs: build
    runs-on: ${{ inputs.platform == 'android' && 'ubuntu-latest' || 'macos-15' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: subject
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: artifact-${{ inputs.slug }}
          path: prebuilt

      - name: Verify
        run: ./verify.sh subject --runtime --prebuilt prebuilt --json verdict.json --badge verdict.svg || true

      - name: Attach the run to the verdict
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open("verdict.json"))
          d["repository"] = "https://github.com/${{ inputs.repository }}"
          d["run"] = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json.dump(d, open("verdict.json", "w"), indent=2, ensure_ascii=False)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {d['name']} — **{d['message']}**\n\n")
              for n in d.get("notes", []):
                  f.write(f"- {n}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-${{ inputs.slug }}
          path: |
            verdict.json
            verdict.svg

  record:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verdict-${{ inputs.slug }}
          path: verdict

      - name: Record the result
        run: |
          git config user.name "stays-local bot"
          git config user.email "noreply@github.com"
          # Re-apply onto the freshest origin each attempt rather than rebasing.
          # These files are generated, so there is no merge to do: the verdict
          # this run computed is the one that should land. Rebasing them
          # produced content conflicts when two runs overlapped, and left the
          # tree unmerged so every retry after the first was guaranteed to fail.
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp verdict/verdict.json "registry/${{ inputs.slug }}.json"
            cp verdict/verdict.svg "badges/${{ inputs.slug }}.svg"
            python3 tools/render-registry.py
            git add registry badges README.md
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "Certify ${{ inputs.slug }}"
            git push && exit 0
            echo "push attempt $attempt lost a race, re-applying"
            sleep 5
          done
          exit 1
