name: Certify

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "owner/repo to certify"
        required: true
      ref:
        description: "git ref (blank = default branch)"
        required: false
        default: ""
      slug:
        description: "registry filename, e.g. steam-shelf"
        required: true

jobs:
  certify:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: subject

      - name: Verify
        run: ./verify.sh subject --runtime --json "registry/${{ inputs.slug }}.json"

      - name: Record the result
        run: |
          python3 - <<'PY'
          import json, os
          p = "registry/${{ inputs.slug }}.json"
          d = json.load(open(p))
          d["repository"] = "https://github.com/${{ inputs.repository }}"
          d["run"] = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          PY
          git config user.name "stays-local bot"
          git config user.email "noreply@github.com"
          git add registry
          git commit -m "Certify ${{ inputs.slug }}" && git push
