name: Re-verify the registry

# Manual only, on purpose. This builds an applicant's current source, and doing
# that on a timer means an app certified while benign can swap in a malicious
# build later and have it executed automatically. Staleness is handled by the
# date on the badge and by .github/workflows/staleness.yml, neither of which
# runs anyone's code.
on:
  workflow_dispatch:

concurrency:
  group: registry-writes
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.collect.outputs.entries }}
      count: ${{ steps.collect.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: collect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          out = []
          for f in sorted(pathlib.Path("registry").glob("*.json")):
              if f.name == "ownership.json":
                  continue
              d = json.load(open(f))
              repo = d.get("repository", "")
              if "github.com/" not in repo:
                  continue
              out.append({
                  "slug": f.stem,
                  "repository": repo.split("github.com/")[-1].strip("/"),
                  "platform": d.get("platform", "macos"),
              })
          print("entries=" + json.dumps(out))
          print("count=" + str(len(out)))
          PY
      - run: echo "Re-verifying ${{ steps.collect.outputs.count }} entr(ies)"

  # Read-only, and no credentials in the workspace: this job builds an
  # applicant's arbitrary code, so it must not hold a token that can write
  # this repository. The verdict travels to the recording job as an artifact.
  verify:
    needs: list
    if: needs.list.outputs.count != '0'
    runs-on: ${{ matrix.entry.platform == 'android' && 'ubuntu-latest' || 'macos-15' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.list.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.entry.repository }}
          path: subject
          persist-credentials: false

      # A failing verdict is a result to record, not a reason to stop. The
      # verifier writes a verdict on every exit path, including a build that
      # never produced a bundle, so "|| true" cannot leave a stale PASS behind.
      - name: Verify
        run: ./verify.sh subject --runtime --json verdict.json --badge verdict.svg || true

      - name: Attach the run to the verdict
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open("verdict.json"))
          d["repository"] = "https://github.com/${{ matrix.entry.repository }}"
          d["run"] = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          json.dump(d, open("verdict.json", "w"), indent=2, ensure_ascii=False)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {d['name']} — **{d['message']}**\n\n")
              for n in d.get("notes", []):
                  f.write(f"- {n}\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: verdict-${{ matrix.entry.slug }}
          path: |
            verdict.json
            verdict.svg

  record:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: verdicts
      - name: Record every verdict
        run: |
          git config user.name "stays-local bot"
          git config user.email "noreply@github.com"
          # Re-apply onto the freshest origin each attempt rather than rebasing.
          # These files are generated, so there is no merge to do: the verdict
          # this run computed is the one that should land. Rebasing them
          # produced content conflicts when two runs overlapped, and left the
          # tree unmerged so every retry after the first was guaranteed to fail.
          for attempt in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            shopt -s nullglob
            for d in verdicts/verdict-*/; do
              slug=$(basename "$d"); slug=${slug#verdict-}
              cp "$d/verdict.json" "registry/$slug.json"
              cp "$d/verdict.svg" "badges/$slug.svg"
            done
            python3 tools/render-registry.py
            git add registry badges
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "Re-verify the registry"
            git push && exit 0
            echo "push attempt $attempt lost a race, re-applying"
            sleep 5
          done
          exit 1
